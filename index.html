<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加油站排班系統</title>
<meta name="theme-color" content="#0f766e">
<meta name="description" content="多站加油站排班工具：營業時間、班別、正職/計時人員、勞基法檢查、工時統計。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="加油站排班">
<style>
:root{
  --bg:#f3f5f7;--card:#fff;--text:#1d2730;--muted:#66727f;--line:#dbe1e7;--line2:#eef1f4;
  --accent:#0f766e;--accent-ink:#fff;--accent-2:#e3f3f0;
  --err:#c81e1e;--err-bg:#fde8e8;--warn:#a85a00;--warn-bg:#fff2dc;--info:#1d5fd1;--info-bg:#e7efff;
  --hol:#c2410c;--hol-bg:#fff0e6;--off:#8a96a3;--off-bg:#eef1f4;
  --shadow:0 1px 2px rgba(15,30,45,.06),0 2px 8px rgba(15,30,45,.05);
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151a;--card:#182027;--text:#e5ebf0;--muted:#93a0ad;--line:#2b3640;--line2:#1f2930;
  --accent:#2bb3a3;--accent-ink:#05201d;--accent-2:#10332f;
  --err:#f17575;--err-bg:#3a1b1b;--warn:#f0b640;--warn-bg:#382a10;--info:#6aa3ff;--info-bg:#152740;
  --hol:#fb9a5c;--hol-bg:#3a2214;--off:#7f8b97;--off-bg:#222c35;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:17px;margin-bottom:10px}
h3{font-size:15px}
small,.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}

/* ---------- 版面 ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--accent);color:var(--accent-ink)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.top select{flex:1;min-width:0;max-width:320px;margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:6px 8px}
.top select option{color:#1d2730;background:#fff}
#nav{display:flex;gap:4px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
#nav button{border:0;background:none;padding:11px 14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px}
#nav button svg{width:18px;height:18px}
#nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:14px 16px 40px;max-width:1500px;margin:0 auto}
@media (max-width:720px){
  #nav{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:0 0 env(safe-area-inset-bottom);border-top:1px solid var(--line);border-bottom:0;justify-content:space-around}
  #nav button{flex:1;flex-direction:column;gap:2px;font-size:12px;padding:7px 0 6px;border-bottom:0;border-top:3px solid transparent}
  #nav button.on{border-top-color:var(--accent)}
  main{padding:12px 12px 90px}
  .brand span{display:none}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;flex-wrap:wrap}
.gap{gap:8px}
.grow{flex:1}

/* ---------- 按鈕、表單 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.btn.sm{min-height:30px;padding:3px 9px;font-size:13px}
.btn.icon{padding:6px 9px}
.btn svg{width:18px;height:18px}
.btn .cnt{background:var(--err);color:#fff;border-radius:10px;padding:0 6px;font-size:12px;line-height:18px}
.btn .cnt.w{background:var(--warn)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
input[type=number]{width:70px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:0;border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld>span{font-size:13px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:12px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;line-height:20px;margin-left:6px;vertical-align:middle;font-weight:500}
.tag.hol{background:var(--hol-bg);color:var(--hol)}
.tag.cls{background:var(--off-bg);color:var(--muted)}
.tag.err{background:var(--err-bg);color:var(--err)}
.tag.ok{background:var(--accent-2);color:var(--accent)}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:0 5px;line-height:17px;margin-left:5px;font-weight:600;vertical-align:1px}
.badge.full{background:var(--accent-2);color:var(--accent)}
.badge.part{background:var(--info-bg);color:var(--info)}

/* ---------- 期間列 ---------- */
.pbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pbar .lbl{font-weight:700;font-size:16px;min-width:0}
.pbar .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:720px){.pbar .tools{margin-left:0;width:100%}.pbar .tools .btn.pri{flex:1}}

/* ---------- 表格班表 ---------- */
.grid-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:calc(100vh - 230px);box-shadow:var(--shadow)}
@media (max-width:720px){.grid-wrap{max-height:calc(100vh - 300px)}}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px}
.grid th,.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;text-align:center}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--card);padding:5px 2px;font-weight:600;min-width:46px;border-bottom:1px solid var(--line)}
.grid thead th .wd{font-size:11px;color:var(--muted);font-weight:500}
.grid thead th.we .wd{color:var(--accent)}
.grid thead th.hol{background:var(--hol-bg);color:var(--hol)}
.grid thead th.hol .wd{color:var(--hol)}
.grid thead th.today{box-shadow:inset 0 -3px 0 var(--accent)}
.grid thead th.cl{color:var(--muted);text-decoration:line-through}
.grid .name{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:4px 8px;min-width:96px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);font-weight:500;cursor:pointer}
.grid thead .name{z-index:4;cursor:default}
.grid .sum{min-width:48px;padding:4px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--card)}
.grid .sum.bad{color:var(--err);font-weight:700}
.grid td.c{height:40px;min-width:46px;cursor:pointer;position:relative}
.grid td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.c .sh{display:block;margin:3px;border-radius:6px;line-height:32px;font-weight:700;background:color-mix(in srgb,var(--sc) 22%,transparent);color:color-mix(in srgb,var(--sc) 70%,var(--text));border-left:3px solid var(--sc)}
.grid td.c .of{color:var(--off);font-weight:600}
.grid td.c .of.R{color:var(--accent)}
.grid td.c .of.A,.grid td.c .of.L{color:var(--info)}
.grid td.c .of.H{color:var(--hol)}
.grid td.c.hol{background:color-mix(in srgb,var(--hol-bg) 55%,transparent)}
.grid td.c.cl{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line2) 6px 8px)}
.grid td.c.lk::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--info) transparent transparent}
.grid td.c.e-err{box-shadow:inset 0 0 0 2px var(--err)}
.grid td.c.e-warn{box-shadow:inset 0 0 0 2px var(--warn)}
.grid td.c.e-err::before,.grid td.c.e-warn::before{content:"";position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--err)}
.grid td.c.e-warn::before{background:var(--warn)}
.grid tfoot th,.grid tfoot td{background:var(--card);font-size:12px;padding:4px 2px;font-variant-numeric:tabular-nums}
.grid tfoot tr:first-child>*{border-top:2px solid var(--line)}
.grid tfoot .name{font-weight:600}
.grid tfoot td.short{color:var(--err);font-weight:700;background:var(--err-bg)}
.grid tfoot td.ok{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:10px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* ---------- 每日檢視 ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.day{padding:12px}
.day h3{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.srow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line2)}
.slabel{width:78px;flex:none;white-space:nowrap;font-weight:700;border-left:4px solid var(--sc);padding-left:6px;line-height:1.2}
.slabel small{display:block;font-weight:400;font-size:11px}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:2px 10px;cursor:pointer;font-size:14px;min-height:30px}
.chip.e-err{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.chip.e-warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .lkm{color:var(--info);margin-left:3px;font-size:11px}
.cntb{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:5px}
.cntb.short{color:var(--err);font-weight:700}
.offrow{font-size:13px;color:var(--muted);padding-top:7px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.offrow .chip{font-size:13px;min-height:26px;padding:1px 8px}

/* ---------- 問題清單 ---------- */
.issues{margin-top:14px}
.issues summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.issues summary::-webkit-details-marker{display:none}
.iss{list-style:none;padding:0;margin:8px 0 0}
.iss li{padding:7px 10px;border-radius:8px;margin-bottom:5px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.iss li[data-act]{cursor:pointer}
.iss li.err{background:var(--err-bg);color:var(--err)}
.iss li.warn{background:var(--warn-bg);color:var(--warn)}
.iss li.info{background:var(--info-bg);color:var(--info)}
.iss li b{white-space:nowrap}
.iss li span{color:var(--text)}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.emp{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.emp .info{flex:1;min-width:0;cursor:pointer}
.emp .info b{font-size:15px}
.emp .info div{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp.inactive{opacity:.55}
.tbl-wrap{overflow:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line2);padding:7px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{color:var(--muted);font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.tbl td.bad{color:var(--err);font-weight:700}
.tbl td.wn{color:var(--warn);font-weight:700}
.log{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start}
.log .t{flex:1}
.log small{display:block}

/* ---------- 設定 ---------- */
.shift-card{border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:10px;padding:10px;margin-bottom:10px}
.shift-card .row>label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.needs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.needs label{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:2px}
.needs input{width:100%;text-align:center;padding:4px 2px}
.sw{display:inline-flex;gap:5px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c)}
.sw button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.hours td,.hours th{padding:4px 6px;text-align:left}
.cov-ok{color:var(--accent)}
.cov-bad{color:var(--err)}
.hol-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.hol-list span{background:var(--hol-bg);color:var(--hol);border-radius:6px;padding:2px 4px 2px 8px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.hol-list button{border:0;background:none;color:inherit;cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.rules{margin:6px 0 0;padding-left:20px;font-size:14px}
.rules li{margin-bottom:3px}

/* ---------- 彈出視窗 ---------- */
#ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#ov.show{display:flex}
#sheet{background:var(--card);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media (max-width:720px){#ov{align-items:flex-end;padding:0}#sheet{max-width:none;border-radius:16px 16px 0 0;max-height:85vh;padding-bottom:max(16px,env(safe-area-inset-bottom))}}
#sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#sheet .hd h3{flex:1;font-size:17px}
.x{border:0;background:var(--off-bg);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.sec{font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.opt{border:1px solid var(--line);border-left:4px solid var(--sc,var(--line));background:var(--card);border-radius:8px;padding:7px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-height:48px}
.opt small{font-size:12px}
.opt em{font-style:normal;font-size:11px;color:var(--warn);line-height:1.3;margin-top:2px}
.opt.on{background:var(--accent-2);border-color:var(--accent);border-left-color:var(--sc,var(--accent))}
.li{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;text-align:left}
.li em{font-style:normal;font-size:12px;color:var(--warn);display:block}
.li .r{color:var(--muted);font-size:13px;white-space:nowrap}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.days7{display:flex;gap:4px;flex-wrap:wrap}
.days7 label{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:7px;padding:3px 7px;cursor:pointer}
.days7 input{accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#1d2730;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{transform:translate(-50%,0)}
#toast button{background:none;border:1px solid rgba(255,255,255,.4);color:#7ff0e0;border-radius:6px;padding:3px 10px;cursor:pointer;white-space:nowrap}
@media (max-width:720px){#toast{bottom:84px}}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}

/* ---------- 列印 ---------- */
.print-title{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;color:#000}
  .top,#nav,.pbar .tools,.issues,.legend,#toast,#ov,.noprint{display:none!important}
  .print-title{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
  main{padding:0;max-width:none}
  .grid-wrap{max-height:none;overflow:visible;border:0;box-shadow:none}
  .grid thead th,.grid .name{position:static}
  .grid td.c{height:26px;min-width:0}
  .grid td.c .sh{line-height:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grid th,.grid td{border-color:#999}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M7 7h4v4H7z"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>
    <span>加油站排班</span>
  </div>
  <select id="stSel" aria-label="切換加油站"></select>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="ov"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   加油站排班系統
   資料只存在本機（localStorage），可匯出／匯入 JSON 備份。
   ========================================================= */

// ---------- 小工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const WD = ['日','一','二','三','四','五','六'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const dow = s => pd(s).getDay();
const dayNo = s => Math.round(pd(s).getTime() / 864e5);
const diffD = (a, b) => dayNo(b) - dayNo(a);
const todayStr = () => ds(new Date());
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
const tm = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return h*60 + (m||0); };
const fmtH = h => (Math.round(h*10)/10).toString();
const range = (a, b) => { const r = []; for (let x = a; x <= b; x = addD(x, 1)) r.push(x); return r; };

const getCell = (st, d, e) => (st.sched[d] && st.sched[d][e]) || '';

// ---------- 班別計算 ----------
function shiftSpan(sh) { const s = tm(sh.start); let e = tm(sh.end); if (e <= s) e += 1440; return { s, e }; }
function shiftHours(sh) { const { s, e } = shiftSpan(sh); return Math.max(0, (e - s - (+sh.breakMin || 0)) / 60); }
const overlap = (a, b, c, d) => a < d && c < b;
// 第49條的夜間（22:00–06:00）
function isNight(sh) { const { s, e } = shiftSpan(sh); return overlap(s, e, -120, 360) || overlap(s, e, 1320, 1800); }
// 大夜：班次涵蓋凌晨 00:00–05:00（員工「可排大夜」用）
function isOvernight(sh) { const { s, e } = shiftSpan(sh); return overlap(s, e, 0, 300) || overlap(s, e, 1440, 1740); }
function availOK(e, sh, d) {
  if (e.type !== 'part') return true;
  if (!e.avail.days[dow(d)]) return false;
  const f = tm(e.avail.from); let t = tm(e.avail.to);
  if (f === t) return true;
  if (t <= f) t += 1440;
  const { s, e: en } = shiftSpan(sh);
  return s >= f && en <= t;
}
function codeLabel(st, c, long) {

  if (OFF[c]) return long ? OFF[c].name : OFF[c].lb;
  const sh = st.shifts.find(s => s.id === c);

}

// ---------- 排班期間 ----------
function periodDates(st, anchor) {

    if (st.period === 'biweek') { const ref = weekStartOf('2026-01-05', st.weekStart); if (((Math.floor(diffD(ref, a) / 7)) % 2 + 2) % 2) a = addD(a, -7); }
    b = addD(a, st.period === 'week' ? 6 : 13);
  }

}

  return `${a.slice(0,4)}/${md(a)}（${WD[dow(a)]}）– ${a.slice(0,4) !== b.slice(0,4) ? b.slice(0,4) + '/' : ''}${md(b)}（${WD[dow(b)]}）`;
}

/* =========================================================
   勞基法檢查
   err：違法　warn：要注意（休息日出勤、超時、缺人）　info：提醒
   ========================================================= */
function analyze(st, dates) {
  const start = dates[0], end = dates[dates.length-1], ws = st.weekStart;
  const extS = weekStartOf(minS(addD(start, -14), monthStart(start)), ws);
  const extE = addD(weekStartOf(maxS(addD(end, 7), monthEnd(end)), ws), 6);
  const ext = range(extS, extE);
  const inP = new Set(dates), smap = shiftMap(st), hol = holMap();
  const restGap = +st.rules.restGap, otMax = +st.rules.otMax;
  const res = { cell: {}, list: [], cov: {}, emp: {} };
  const add = (lvl, e, d, msg, onCell = true) => {
    if (d && !inP.has(d)) return;
    if (onCell && d && e) (res.cell[d + '|' + e.id] ??= []).push({ lvl, msg });
    res.list.push({ lvl, eid: e ? e.id : null, name: e ? e.name : '', d, msg, onCell: onCell && !!d && !!e });
  };
  const months = [...new Set(dates.map(d => d.slice(0,7)))];

  for (const e of activeEmps(st)) {
    const day = {};
    for (const d of ext) {
      const sh = smap[getCell(st, d, e.id)];
      if (sh) { const sp = shiftSpan(sh), base = dayNo(d) * 1440; day[d] = { sh, h: shiftHours(sh), s: base + sp.s, e: base + sp.e }; }
    }
    const ot = {}, restWork = new Set();
    // 每日工時（第32條：含加班一天不超過12小時）
    for (const d of ext) if (day[d]) {
      if (day[d].h > 12) add('err', e, d, `一天工時 ${fmtH(day[d].h)} 小時，含加班不得超過 12 小時（第32條）`);
      ot[d] = Math.max(0, day[d].h - 8);
    }
    // 換班間隔（第34條）
    let prev = null;
    for (const d of ext) {
      const w = day[d]; if (!w) continue;
      if (prev) {
        const gap = (w.s - prev.e) / 60;
        if (gap < 0) add('err', e, d, `與 ${md(prev.d)} 的班次時間重疊`);
        else if (gap < restGap) add('err', e, d, `與 ${md(prev.d)} 下班相隔只有 ${fmtH(gap)} 小時，換班應至少間隔 ${restGap} 小時（第34條）`);
      }
      prev = { ...w, d };
    }
    // 連續上班（第36條：每7日應有1日例假，不得連續工作超過6日）
    let run = 0;
    for (const d of ext) {
      if (day[d]) { run++; if (run > 6) add('err', e, d, `連續上班第 ${run} 天，不得連續工作超過 6 天（第36條）`); }
      else run = 0;
    }
    // 一例一休、每週40小時（第30、36條）
    for (let w0 = extS; w0 <= extE; w0 = addD(w0, 7)) {
      const wd = range(w0, addD(w0, 6));
      const works = wd.filter(d => day[d]);
      if (works.length >= 7) add('err', e, works[6], '本週 7 天都排班，沒有例假（例假不得出勤，第36條）');
      else if (works.length === 6) {
        const rd = works[5]; restWork.add(rd); ot[rd] = day[rd].h;
        add('warn', e, rd, '本週只休 1 天，這天算「休息日出勤」，工時全部計入加班（第24、36條）');
      }
      let normal = 0;
      for (const d of works) if (!restWork.has(d)) normal += Math.min(day[d].h, 8);
      if (normal > 40) { const last = works.filter(d => !restWork.has(d)).pop(); ot[last] = (ot[last] || 0) + normal - 40; add('warn', e, last, `本週正常工時 ${fmtH(normal)} 小時，超過 40 小時的部分算加班（第30條）`); }
      if (wd.every(d => inP.has(d)) && works.length < 7 && !wd.some(d => getCell(st, d, e.id) === 'R'))
        add('warn', e, null, `${md(wd[0])}–${md(wd[6])} 這週還沒指定「例假」，請把一天休假標為「例」`, false);
      if (e.type === 'part' && +e.maxWeek > 0) {
        const hh = works.reduce((t, d) => t + day[d].h, 0);
        if (hh > +e.maxWeek && works.length) add('warn', e, works[works.length-1], `本週排 ${fmtH(hh)} 小時，超過他希望的上限 ${e.maxWeek} 小時`);
      }
    }
    // 每月加班上限（第32條）
    const monthOT = {};
    for (const d of ext) monthOT[d.slice(0,7)] = (monthOT[d.slice(0,7)] || 0) + (ot[d] || 0);
    for (const m of months) {
      const v = monthOT[m] || 0;
      if (v > otMax) add('err', e, null, `${+m.slice(5)} 月加班 ${fmtH(v)} 小時，超過每月上限 ${otMax} 小時（第32條）`, false);
      else if (v > otMax * 0.8) add('warn', e, null, `${+m.slice(5)} 月加班 ${fmtH(v)} 小時，接近每月上限 ${otMax} 小時`, false);
    }
    // 個人條件
    let femNight = false;
    for (const d of dates) {
      const w = day[d]; if (!w) continue;
      if (!availOK(e, w.sh, d)) add('warn', e, d, '不在他填的可上班日／時段');
      if (isOvernight(w.sh) && !e.nightOK) add('warn', e, d, '這位員工設定為「不排大夜」');
      if (isNight(w.sh) && e.gender === 'F') femNight = true;
      if (isClosed(st, d)) add('warn', e, d, '這天設定為休業日');
    }
    if (femNight) add('info', e, null, '女性員工排到 22:00–06:00 的班：需經工會或勞資會議同意，並提供安全衛生設施與交通工具（第49條）', false);

    // 統計
    const sm = { days: 0, hours: 0, ot: 0, holH: 0, off: { R:0, O:0, A:0, L:0, H:0 }, monthOT };
    for (const d of dates) {
      const c = getCell(st, d, e.id);
      if (day[d]) { sm.days++; sm.hours += day[d].h; sm.ot += ot[d] || 0; if (hol[d]) sm.holH += day[d].h; }
      else if (OFF[c]) sm.off[c]++;
    }
    res.emp[e.id] = sm;
  }
  // 人力需求
  const emps = activeEmps(st);
  for (const d of dates) {
    const cl = isClosed(st, d); res.cov[d] = {};
    for (const sh of st.shifts) {
      const need = cl ? 0 : (+sh.need[dow(d)] || 0);
      const have = emps.filter(e => getCell(st, d, e.id) === sh.id).length;
      res.cov[d][sh.id] = { have, need };
      if (have < need) add('warn', null, d, `${sh.name}還缺 ${need - have} 人（需要 ${need}，已排 ${have}）`, false);
    }
  }
  const rank = { err: 0, warn: 1, info: 2 };
  res.list.sort((a, b) => rank[a.lvl] - rank[b.lvl] || String(a.d || '').localeCompare(String(b.d || '')));
  return res;
}

// 排某人某天某班時會碰到的問題（自動排班時全部視為不能排）
function assignReasons(st, e, d, sh) {
  const R = [], smap = shiftMap(st);
  if (isLocked(st, d, e.id)) R.push('已鎖定休假');
  if (isClosed(st, d)) R.push('本日休業');
  const sp = shiftSpan(sh), h = shiftHours(sh);
  if (h > 12) R.push('班次超過 12 小時');
  if (!availOK(e, sh, d)) R.push('不在可上班時段');
  if (isOvernight(sh) && !e.nightOK) R.push('設定不排大夜');
  const base = dayNo(d) * 1440, s = base + sp.s, en = base + sp.e;
  for (const k of [-1, 1]) {
    const dd = addD(d, k), s2 = smap[getCell(st, dd, e.id)];
    if (!s2) continue;
    const p = shiftSpan(s2), b2 = dayNo(dd) * 1440;
    const gap = k < 0 ? (s - (b2 + p.e)) / 60 : ((b2 + p.s) - en) / 60;
    if (gap < +st.rules.restGap) R.push(`與${k < 0 ? '前' : '隔'}一天班次只隔 ${fmtH(Math.max(0, gap))} 小時`);
  }
  const isW = x => !!smap[getCell(st, x, e.id)];
  let back = 0, fwd = 0;
  for (let x = addD(d, -1); back < 14 && isW(x); x = addD(x, -1)) back++;
  for (let x = addD(d, 1); fwd < 14 && isW(x); x = addD(x, 1)) fwd++;
  if (back + 1 + fwd > 6) R.push(`會連續上班 ${back + 1 + fwd} 天`);
  const w0 = weekStartOf(d, st.weekStart); let wd = 0, wh = 0;
  for (let i = 0; i < 7; i++) { const x = addD(w0, i); if (x === d) continue; const c = smap[getCell(st, x, e.id)]; if (c) { wd++; wh += shiftHours(c); } }
  if (wd >= 6) R.push('本週會沒有例假');
  else if (wd >= 5) R.push('本週已上 5 天（會變休息日出勤）');
  const lim = e.type === 'part' ? (+e.maxWeek || 40) : 40;
  if (wh + h > lim) R.push(`本週會達 ${fmtH(wh + h)} 小時（上限 ${lim}）`);
  return R;
}

// ---------- 自動排班 ----------
function weekLoad(st, e, d) {
  const smap = shiftMap(st), w0 = weekStartOf(d, st.weekStart); let wd = 0, wh = 0;
  for (let i = 0; i < 7; i++) { const c = smap[getCell(st, addD(w0, i), e.id)]; if (c) { wd++; wh += shiftHours(c); } }
  return { wd, wh, left: 7 - diffD(w0, d) };
}
function score(st, e, d, sh) {
  const { wd, wh, left } = weekLoad(st, e, d);
  let sc;
  if (e.type === 'full') sc = (5 - wd) / left * 100 + 30;
  else {
    const h = shiftHours(sh) || 1, max = +e.maxWeek || 40;
    sc = Math.min(1, (max - wh) / h / left) * 100;
    if (+e.minWeek && wh < +e.minWeek) sc += 25;
  }
  const y = getCell(st, addD(d, -1), e.id);
  if (y === sh.id) sc += 15;
  return sc + Math.random() * 6;
}
function autoSchedule(st, dates, mode) {
  undoSnap = { sid: st.id, sched: JSON.stringify(st.sched), locks: JSON.stringify(st.locks) };
  const emps = activeEmps(st), smap = shiftMap(st);
  if (mode === 'all') for (const d of dates) for (const e of emps) {
    const c = getCell(st, d, e.id);
    if (!isLocked(st, d, e.id) && (smap[c] || c === 'R' || c === 'O' || c === 'H' || (c && !OFF[c]))) setCell(st, d, e.id, '');
  }
  const count = () => { let n = 0; for (const d of dates) for (const e of emps) if (smap[getCell(st, d, e.id)]) n++; return n; };
  const before = count();
  for (let round = 0; round < 6; round++) {
    fillGreedy(st, dates, emps);
    if (!repairShort(st, dates, emps)) break;
  }
  labelOffs(st, dates, emps);
  save();
  let short = 0;
  for (const d of dates) if (!isClosed(st, d)) for (const sh of st.shifts) short += Math.max(0, (+sh.need[dow(d)] || 0) - emps.filter(e => getCell(st, d, e.id) === sh.id).length);
  return { placed: count() - before, short };
}
const lackOf = (st, d, sh, emps) => isClosed(st, d) ? 0 : Math.max(0, (+sh.need[dow(d)] || 0) - emps.filter(e => getCell(st, d, e.id) === sh.id).length);
function fillGreedy(st, dates, emps) {
  for (const d of dates) {
    if (isClosed(st, d)) continue;
    const left = {};
    for (const sh of st.shifts) left[sh.id] = lackOf(st, d, sh, emps);
    // 每次先補「能排的人最少」的班（例如大夜），避免能上大夜的人先被早、中班用掉
    for (;;) {
      let pick = null;
      for (const sh of st.shifts) {
        if (!left[sh.id]) continue;
        const cands = emps.filter(e => !getCell(st, d, e.id) && !assignReasons(st, e, d, sh).length);
        const slack = cands.length - left[sh.id];
        if (!pick || slack < pick.slack) pick = { sh, cands, slack };
      }
      if (!pick) break;
      if (!pick.cands.length) { left[pick.sh.id] = 0; continue; }
      let best = null, bs = -1e9;
      for (const e of pick.cands) { const sc = score(st, e, d, pick.sh); if (sc > bs) { bs = sc; best = e; } }
      setCell(st, d, best.id, pick.sh.id); left[pick.sh.id]--;
    }
  }
}
// 補缺人的班：把 A 從同一週的另一天（d2）移到缺人的這天，d2 那班再找別人頂上
function repairShort(st, dates, emps) {
  const inP = new Set(dates), smap = shiftMap(st);
  const free = (e, d) => !getCell(st, d, e.id) && !isLocked(st, d, e.id);
  let fixed = 0;
  for (const d of dates) for (const sh of st.shifts) {
    while (lackOf(st, d, sh, emps) > 0) {
      let done = false;
      for (const e of emps) {
        if (!free(e, d)) continue;
        const w0 = weekStartOf(d, st.weekStart);
        for (let i = 0; i < 7 && !done; i++) {
          const d2 = addD(w0, i);
          if (d2 === d || !inP.has(d2) || isLocked(st, d2, e.id)) continue;
          const sh2 = smap[getCell(st, d2, e.id)];
          if (!sh2) continue;
          setCell(st, d2, e.id, '');
          if (!assignReasons(st, e, d, sh).length) {
            setCell(st, d, e.id, sh.id);
            const p = emps.find(p => p.id !== e.id && free(p, d2) && !assignReasons(st, p, d2, sh2).length);
            if (p) { setCell(st, d2, p.id, sh2.id); done = true; fixed++; break; }
            setCell(st, d, e.id, '');
          }
          setCell(st, d2, e.id, sh2.id);
        }
        if (done) break;
      }
      if (!done) break;
    }
  }
  return fixed;
}
// 把空白的休假日標成 例／休／國
function labelOffs(st, dates, emps) {
  const inP = new Set(dates), smap = shiftMap(st), hol = holMap();
  const weeks = [...new Set(dates.map(d => weekStartOf(d, st.weekStart)))];
  for (const e of emps) for (const w0 of weeks) {
    const wd = range(w0, addD(w0, 6)), codes = wd.map(x => getCell(st, x, e.id));
    const works = codes.filter(c => smap[c]).length;
    const empt = wd.filter((x, i) => inP.has(x) && !codes[i] && !isLocked(st, x, e.id)).reverse();
    if (!codes.includes('R') && empt.length) setCell(st, empt.shift(), e.id, 'R');
    if (!codes.includes('O') && works < 6 && empt.length) setCell(st, empt.shift(), e.id, 'O');
    for (const x of empt) if (hol[x]) setCell(st, x, e.id, 'H');
  }
}
function clearPeriod(st, dates) {
  undoSnap = { sid: st.id, sched: JSON.stringify(st.sched), locks: JSON.stringify(st.locks) };
  for (const d of dates) for (const e of st.emps) if (!isLocked(st, d, e.id)) setCell(st, d, e.id, '');
  save();
}
function undo() {
  if (!undoSnap) return;
  const st = S.stations.find(s => s.id === undoSnap.sid);
  if (st) { st.sched = JSON.parse(undoSnap.sched); st.locks = JSON.parse(undoSnap.locks); save(); }
  undoSnap = null; render(); toast('已復原');
}

// ---------- 特休（第38條） ----------
function annualLeave(st, e, ref) {
  if (!e.hire || e.hire > ref) return null;
  const h = e.hire;
  let from, to, ent, yrs;
  if (ref < addMonths(h, 6)) return { ent: 0, used: 0, from: null, to: addMonths(h, 6), yrs: 0 };
  if (ref < addMonths(h, 12)) { from = addMonths(h, 6); to = addMonths(h, 12); ent = 3; yrs = 0.5; }
  else {
    let y = 1; while (ref >= addMonths(h, 12 * (y + 1))) y++;
    from = addMonths(h, 12 * y); to = addMonths(h, 12 * (y + 1)); yrs = y;
    ent = y < 2 ? 7 : y < 3 ? 10 : y < 5 ? 14 : y < 10 ? 15 : Math.min(30, 15 + (y - 9));
  }
  let used = 0;
  for (const d in st.sched) if (d >= from && d < to && st.sched[d][e.id] === 'A') used++;
  return { ent, used, from, to: addD(to, -1), yrs };
}
function tenure(h, ref) {
  if (!h || h > ref) return '';
  let m = 0; while (addMonths(h, m + 1) <= ref) m++;
  const y = Math.floor(m / 12), r = m % 12;
  return y ? `${y} 年${r ? ` ${r} 個月` : ''}` : `${r} 個月`;
}

// 檢查班別有沒有涵蓋營業時間
function coverageCheck(st) {
  const out = [];
  for (const w of WEEK_ORDER) {
    const hd = st.hours.days[w];
    if (st.hours.mode === 'custom' && hd.closed) { out.push(`<div>星期${WD[w]}：公休</div>`); continue; }
    let o = 0, c = 1440;
    if (st.hours.mode === 'custom') { o = tm(hd.open); c = tm(hd.close); if (c <= o) c += 1440; }
    const cov = new Uint8Array(2880 / 15);
    const pw = (w + 6) % 7;
    for (const sh of st.shifts) {
      const { s, e } = shiftSpan(sh);
      if (+sh.need[w] > 0) for (let t = s; t < e; t += 15) cov[t / 15 | 0] = 1;
      if (+sh.need[pw] > 0 && e > 1440) for (let t = s - 1440; t < e - 1440; t += 15) if (t >= 0) cov[t / 15 | 0] = 1;
    }
    const gaps = []; let g = null;
    for (let t = o; t < c; t += 15) {
      if (!cov[t / 15 | 0]) { if (g === null) g = t; }
      else if (g !== null) { gaps.push([g, t]); g = null; }
    }
    if (g !== null) gaps.push([g, c]);
    const f = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
    out.push(`<div>星期${WD[w]}：${gaps.length ? `<span class="cov-bad">${gaps.map(([a, b]) => `${f(a)}–${f(b)}`).join('、')} 沒有安排班別</span>` : '<span class="cov-ok">營業時間都有人 ✓</span>'}</div>`);
  }
  const notes = [];
  for (const sh of st.shifts) {
    const { s, e } = shiftSpan(sh);
    if (e - s > 240 && (+sh.breakMin || 0) < 30) notes.push(`${esc(sh.name)}超過 4 小時、休息時間未滿 30 分鐘：若為輪班制或工作有連續性，可在班內調配休息（第35條）。`);
    if (shiftHours(sh) > 8) notes.push(`${esc(sh.name)}工時 ${fmtH(shiftHours(sh))} 小時，超過 8 小時的部分每天都會算加班。`);
  }
  return out.join('') + (notes.length ? `<p class="hint">${notes.join('<br>')}</p>` : '');
}

// ---------- 彈出視窗 ----------
function openSheet(title, body) {
  $('#sheet').innerHTML = `<div class="hd"><h3>${title}</h3><button class="x" data-act="close" aria-label="關閉">×</button></div>${body}`;
  $('#ov').classList.add('show');
  $('#sheet').scrollTop = 0;
}
function closeSheet() { $('#ov').classList.remove('show'); }
let toastTimer;
function toast(msg, act, fn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (act ? `<button>${esc(act)}</button>` : '');
  if (act) t.querySelector('button').onclick = () => { t.classList.remove('show'); fn(); };
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), act ? 7000 : 2600);
}
function confirmSheet(title, msg, okLabel, fn, danger) {
  openSheet(title, `<p>${msg}</p><div class="foot"><button class="btn" data-act="close">取消</button><button class="btn ${danger ? 'danger' : 'pri'}" id="okBtn">${okLabel}</button></div>`);
  $('#okBtn').onclick = () => { closeSheet(); fn(); };
}

function openCell(d, eid) {
  const st = cur(), e = st.emps.find(x => x.id === eid); if (!e) return;
  const c = getCell(st, d, eid), lk = isLocked(st, d, eid), hol = holMap()[d];
  const A = analyze(st, periodDates(st, UI.anchor)), iss = A.cell[d + '|' + eid] || [];
  let h = '';
  if (iss.length) h += `<ul class="iss">${iss.map(i => `<li class="${i.lvl}"><span>${esc(i.msg)}</span></li>`).join('')}</ul>`;
  h += '<div class="sec">上班</div><div class="opts">';
  for (const sh of st.shifts) {
    const rs = c === sh.id ? [] : assignReasons(st, e, d, sh).filter(r => r !== '已鎖定休假');
    h += `<button class="opt ${c === sh.id ? 'on' : ''}" style="--sc:${sh.color}" data-act="setCell" data-d="${d}" data-e="${eid}" data-v="${sh.id}"><b>${esc(sh.name)}</b><small>${sh.start}–${sh.end}</small>${rs.length ? `<em>⚠ ${esc(rs[0])}</em>` : ''}</button>`;
  }
  h += '</div><div class="sec">休假</div><div class="opts">';
  for (const k in OFF) h += `<button class="opt ${c === k ? 'on' : ''}" data-act="setCell" data-d="${d}" data-e="${eid}" data-v="${k}"><b>${OFF[k].lb}</b><small>${OFF[k].name}</small></button>`;
  h += `<button class="opt ${!c ? 'on' : ''}" data-act="setCell" data-d="${d}" data-e="${eid}" data-v=""><b>－</b><small>清除</small></button></div>`;
  h += `<div style="margin-top:12px"><label class="chk"><input type="checkbox" data-f="lock" data-d="${d}" data-e="${eid}" ${lk ? 'checked' : ''}>🔒 鎖定這格（員工預排的休假或指定班，自動排班不會更動）</label></div>`;
  h += `<div class="foot"><button class="btn" data-act="swap" data-d="${d}" data-e="${eid}">⇄ 與同事換班／代班</button></div>`;
  openSheet(`${esc(e.name)}・${md(d)}（${WD[dow(d)]}）${hol ? `<span class="tag hol">${esc(hol)}</span>` : ''}`, h);
}
function openSwap(d, eid) {
  const st = cur(), e = st.emps.find(x => x.id === eid), c = getCell(st, d, eid);
  const others = activeEmps(st).filter(x => x.id !== eid);
  openSheet(`${esc(e.name)} ${md(d)} 換班`, `<p class="hint" style="margin-top:0">${esc(e.name)} 這天是〔${esc(codeLabel(st, c, true))}〕。選一位同事，兩人這天的班會互換；選休假中的同事就是請他代班。</p>
    <label class="fld"><span>原因（會寫進換班紀錄，可不填）</span><input type="text" id="swNote" maxlength="40" placeholder="例如：家中有事"></label>
    ${others.map(o => {
      const oc = getCell(st, d, o.id), smap = shiftMap(st);
      const rs = smap[c] ? assignReasons(st, o, d, smap[c]).filter(r => r !== '已鎖定休假') : [];
      if (smap[oc]) rs.push(...assignReasons(st, e, d, smap[oc]).filter(r => r !== '已鎖定休假').map(r => `${e.name}：${r}`));
      return `<button class="li" data-act="doSwap" data-d="${d}" data-a="${eid}" data-b="${o.id}"><span>${esc(o.name)}<span class="badge ${o.type}">${o.type === 'full' ? '正' : '計'}</span>${rs.length ? `<em>⚠ ${esc(rs.join('、'))}</em>` : ''}</span><span class="r">${esc(codeLabel(st, oc, true))}</span></button>`;
    }).join('')}`);
}
function doSwap(d, a, b) {
  const st = cur(), ca = getCell(st, d, a), cb = getCell(st, d, b);
  if (ca === cb) { toast('兩個人這天的班一樣，不用換'); return; }
  const la = isLocked(st, d, a), lb = isLocked(st, d, b);
  setCell(st, d, a, cb); setCell(st, d, b, ca); setLock(st, d, a, lb); setLock(st, d, b, la);
  const ea = st.emps.find(x => x.id === a), eb = st.emps.find(x => x.id === b);
  st.swaps.unshift({ id: uid('w'), ts: Date.now(), d, a, b, aName: ea.name, bName: eb.name, aFrom: codeLabel(st, ca, true), bFrom: codeLabel(st, cb, true), note: ($('#swNote')?.value || '').trim() });
  save(); closeSheet(); render(); toast('已換班，並記錄在「統計 › 換班紀錄」');
}

function fileName(st, dates, ext) { return `${st.name}_班表_${dates[0]}_${dates[dates.length-1]}.${ext}`.replace(/[\\/:*?"<>|]/g, '_'); }
async function deliver(blob, name) {
  try {
    const f = new File([blob], name, { type: blob.type });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCsv() {
  const st = cur(), dates = periodDates(st, UI.anchor), A = analyze(st, dates), smap = shiftMap(st), hol = holMap();
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const rows = [[`${st.name} 班表 ${periodLabel(st, dates)}`], ['員工', '類型', ...dates.map(d => `${md(d)}(${WD[dow(d)]})${hol[d] ? ' ' + hol[d] : ''}`), '總工時', '加班']];
  for (const e of activeEmps(st)) rows.push([e.name, e.type === 'full' ? '正職' : '計時', ...dates.map(d => { const c = getCell(st, d, e.id); return smap[c] ? smap[c].name : codeLabel(st, c); }), fmtH(A.emp[e.id].hours), fmtH(A.emp[e.id].ot)]);
  rows.push([]);
  for (const sh of st.shifts) rows.push([`${sh.name} 人數`, '', ...dates.map(d => `${A.cov[d][sh.id].have}/${A.cov[d][sh.id].need}`)]);
  rows.push([]);
  rows.push(['班別說明', ...st.shifts.map(s => `${s.name} ${s.start}-${s.end}`)]);
  rows.push(['休假代號', '例=例假', '休=休息日', '特=特休', '假=請假', '國=國定假日']);
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  deliver(new Blob([csv], { type: 'text/csv;charset=utf-8' }), fileName(st, dates, 'csv'));
}
function exportPng() {
  const st = cur(), dates = periodDates(st, UI.anchor), A = analyze(st, dates), smap = shiftMap(st), hol = holMap(), emps = activeEmps(st);
  const nameW = 96, cw = dates.length > 14 ? 40 : 58, rh = 32, titleH = 46, headH = 42, sumW = 56, pad0 = 16;
  const W = pad0 * 2 + nameW + cw * dates.length + sumW;
  const H = pad0 + titleH + headH + rh * (emps.length + st.shifts.length) + 56;
  const cv = document.createElement('canvas'), k = 2;
  cv.width = W * k; cv.height = H * k;
  const x = cv.getContext('2d'); x.scale(k, k);
  const F = (w, s) => `${w} ${s}px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif`;
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#0f766e'; x.font = F(700, 19); x.textBaseline = 'middle';
  x.fillText(`${st.name}　班表　${periodLabel(st, dates)}`, pad0, pad0 + 16);
  let y = pad0 + titleH; const x0 = pad0;
  x.textAlign = 'center';
  dates.forEach((d, i) => {
    const cx = x0 + nameW + i * cw;
    if (hol[d]) { x.fillStyle = '#fff0e6'; x.fillRect(cx, y, cw, headH + rh * emps.length); }
    x.fillStyle = hol[d] ? '#c2410c' : (dow(d) % 6 === 0 ? '#0f766e' : '#1d2730');
    x.font = F(700, 13); x.fillText(md(d), cx + cw / 2, y + 14);
    x.font = F(400, 11); x.fillText(WD[dow(d)] + (hol[d] ? '・' + hol[d].slice(0, 2) : ''), cx + cw / 2, y + 31);
  });
  x.fillStyle = '#1d2730'; x.font = F(700, 13);
  x.fillText('時數', x0 + nameW + cw * dates.length + sumW / 2, y + headH / 2);
  y += headH;
  emps.forEach((e, r) => {
    const ry = y + r * rh;
    x.textAlign = 'left'; x.fillStyle = '#1d2730'; x.font = F(500, 14);
    x.fillText(e.name.length > 6 ? e.name.slice(0, 6) : e.name, x0 + 4, ry + rh / 2);
    x.textAlign = 'center';
    dates.forEach((d, i) => {
      const cx = x0 + nameW + i * cw, c = getCell(st, d, e.id), sh = smap[c];
      if (sh) {
        x.fillStyle = sh.color + '38'; x.fillRect(cx + 2, ry + 3, cw - 4, rh - 6);
        x.fillStyle = sh.color; x.fillRect(cx + 2, ry + 3, 3, rh - 6);
        x.fillStyle = '#1d2730'; x.font = F(700, 14); x.fillText(sh.short, cx + cw / 2 + 1, ry + rh / 2);
      } else if (c) {
        x.fillStyle = c === 'R' ? '#0f766e' : c === 'H' ? '#c2410c' : (c === 'A' || c === 'L') ? '#1d5fd1' : '#8a96a3';
        x.font = F(600, 13); x.fillText(codeLabel(st, c), cx + cw / 2, ry + rh / 2);
      }
    });
    x.fillStyle = '#66727f'; x.font = F(400, 13); x.fillText(fmtH(A.emp[e.id].hours), x0 + nameW + cw * dates.length + sumW / 2, ry + rh / 2);
  });
  let fy = y + emps.length * rh;
  st.shifts.forEach((sh, r) => {
    const ry = fy + r * rh;
    x.textAlign = 'left'; x.fillStyle = '#66727f'; x.font = F(500, 12); x.fillText(`${sh.name} 人數`, x0 + 4, ry + rh / 2);
    x.textAlign = 'center';
    dates.forEach((d, i) => { const c = A.cov[d][sh.id]; x.fillStyle = c.have < c.need ? '#c81e1e' : '#66727f'; x.font = F(c.have < c.need ? 700 : 400, 12); x.fillText(`${c.have}/${c.need}`, x0 + nameW + i * cw + cw / 2, ry + rh / 2); });
  });
  // 格線
  x.strokeStyle = '#dbe1e7'; x.lineWidth = 1;
  const gy0 = pad0 + titleH, gy1 = fy + st.shifts.length * rh;
  for (let r = 0; r <= emps.length + st.shifts.length; r++) { const ly = y + r * rh + .5; x.beginPath(); x.moveTo(x0, ly); x.lineTo(W - pad0, ly); x.stroke(); }
  x.beginPath(); x.moveTo(x0, gy0 + .5); x.lineTo(W - pad0, gy0 + .5); x.stroke();
  for (let i = 0; i <= dates.length + 1; i++) { const lx = x0 + nameW + i * cw + .5; x.beginPath(); x.moveTo(lx, gy0); x.lineTo(lx, gy1); x.stroke(); }
  x.strokeStyle = '#9aa5b1'; x.beginPath(); x.moveTo(x0, fy + .5); x.lineTo(W - pad0, fy + .5); x.stroke();
  x.textAlign = 'left'; x.fillStyle = '#66727f'; x.font = F(400, 12);
  x.fillText(st.shifts.map(s => `${s.short}＝${s.name} ${s.start}-${s.end}`).join('　') + '　例＝例假　休＝休息日　特＝特休　假＝請假　國＝國定假日', x0, gy1 + 20);
  x.fillText(`製表：${new Date().toLocaleString('zh-TW', { hour12: false })}`, x0, gy1 + 40);
  cv.toBlob(b => deliver(b, fileName(st, dates, 'png')), 'image/png');
}

  switch (f) {
    case 'lock': setLock(st, el.dataset.d, el.dataset.e, el.checked); save(); render(); return;
    case 'stName': st.name = v.trim() || '未命名'; save(); render(); return;
    case 'hOpen': st.hours.days[w].open = v; break;
    case 'hClose': st.hours.days[w].close = v; break;
    case 'hClosed': st.hours.days[w].closed = el.checked; save(); render(); return;
    case 'shName': st.shifts[i].name = v.trim() || '班別'; break;
    case 'shShort': st.shifts[i].short = v.trim() || '?'; break;
    case 'shStart': if (v) st.shifts[i].start = v; break;
    case 'shEnd': if (v) st.shifts[i].end = v; break;
    case 'shBreak': st.shifts[i].breakMin = Math.max(0, +v || 0); break;
    case 'shNeed': st.shifts[i].need[w] = Math.max(0, Math.floor(+v || 0)); break;
    case 'period': st.period = v; break;
    case 'weekStart': st.weekStart = +v; break;
    case 'restGap': st.rules.restGap = +v; break;
    case 'otMax': st.rules.otMax = +v; break;
  }
  save();
  const cc = $('#covCheck'); if (cc) cc.innerHTML = coverageCheck(st);
});
$('#stSel').addEventListener('change', ev => {
  if (ev.target.value === '__new') { ev.target.value = S.cur; newStationSheet(false); return; }
  S.cur = ev.target.value; save(); render();
});
$('#fileIn').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) importJson(f); ev.target.value = ''; });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });
document.addEventListener('toggle', ev => { if (ev.target.id === 'issBox') UI.issuesOpen = ev.target.open; }, true);

function newStationSheet(copy) {
  const st = cur();
  openSheet(copy ? '複製本站設定成新站' : '新增加油站', `
    <label class="fld"><span>站名</span><input type="text" id="nsName" maxlength="30" placeholder="例如：中山站"></label>
    ${copy ? `<p class="hint">會複製「${esc(st.name)}」的營業時間、班別、人力需求和法規設定，員工和班表不會複製。</p>` : `<div class="fld"><span>營業型態</span><div class="seg" id="nsMode"><button type="button" class="on" data-v="24h">24 小時</button><button type="button" data-v="custom">07:00–22:00</button></div></div><p class="hint">建立後可以在「設定」調整營業時間和班別。</p>`}
    <div class="foot"><button class="btn" data-act="close">取消</button><button class="btn pri" id="nsOk">建立</button></div>`);
  const m = $('#nsMode');
  if (m) m.onclick = ev => { const b = ev.target.closest('button'); if (b) m.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  setTimeout(() => $('#nsName').focus(), 50);
  $('#nsOk').onclick = () => {
    const name = $('#nsName').value.trim(); if (!name) { toast('請輸入站名'); return; }
    let ns;
    if (copy) {
      ns = newStation(name);
      ns.hours = JSON.parse(JSON.stringify(st.hours));
      ns.shifts = st.shifts.map(s => ({ ...s, id: uid('s'), need: s.need.slice() }));
      ns.period = st.period; ns.weekStart = st.weekStart; ns.rules = { ...st.rules };
    } else ns = newStation(name, m.querySelector('.on').dataset.v);
    S.stations.push(ns); S.cur = ns.id; save(); closeSheet(); UI.tab = 'set'; render(); toast(`已建立 ${name}`);
  };
}

// ---------- PWA ----------
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('#installBtn'); if (b) b.hidden = false; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- 啟動 ----------
S = load() || initState();
save();
render();
window.__roster = { get S() { return S; }, analyze, autoSchedule, periodDates, assignReasons, annualLeave, render, UI };
</script>
